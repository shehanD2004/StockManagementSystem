<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reports - Stock Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar (same as your other pages) -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-dark text-white min-vh-100">
            <div class="position-sticky pt-3">
                <h4 class="text-white text-center mb-4">
                    <i class="bi bi-box-seam"></i> Stock Manager
                </h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/items}">
                            <i class="bi bi-list-ul"></i> All Items
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-white" th:href="@{/reports}">
                            <i class="bi bi-gear"></i> Report Strategies
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/charts}">
                            <i class="bi bi-bar-chart"></i> Analytics
                        </a>
                    </li>
                    

                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h1 class="h2"><i class="bi bi-gear"></i> Reports </h1>

            <!-- Current Strategy Info -->
            <div class="alert alert-info mb-4">
                <h5><i class="bi bi-info-circle"></i> Current Report Format</h5>
                <p class="mb-0">Currently using: <strong th:text="${currentFormat}">TEXT</strong> format</p>
            </div>

            <!-- Strategy Selection -->
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Select Report Format</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/reports/set-format}" method="post">
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="format"
                                               id="text" value="TEXT" checked>
                                        <label class="form-check-label" for="text">
                                            <i class="bi bi-file-text"></i> Text Format
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="format"
                                               id="csv" value="CSV">
                                        <label class="form-check-label" for="csv">
                                            <i class="bi bi-file-spreadsheet"></i> CSV Format
                                        </label>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Set Format
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- PDF Export Section -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0"><i class="bi bi-file-pdf text-danger"></i> Export Reports</h5>
                            </div>
                            <div class="card-body">
                                <div class="row text-center">
                                    <div class="col-md-4 mb-3">
                                        <a th:href="@{/pdf/stock-report}" class="btn btn-danger btn-lg w-100">
                                            <i class="bi bi-file-pdf"></i><br>Full Stock Report
                                        </a>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <a th:href="@{/pdf/low-stock-report}" class="btn btn-warning btn-lg w-100">
                                            <i class="bi bi-file-pdf"></i><br>Low Stock Report
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Generate Report -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Generate Report</h5>
                        </div>
                        <div class="card-body text-center">
                            <p>Generate report using current format:</p>
                            <a th:href="@{/reports/generate}" class="btn btn-success btn-lg">
                                <i class="bi bi-download"></i> Download Report
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Strategy Pattern Explanation -->
            <div class="row mt-4">
                <div class="col-12">
                    <div class="card">

                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Analytics - Stock Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <nav class="col-md-3 col-lg-2 d-md-block bg-dark text-white min-vh-100">
      <div class="position-sticky pt-3">
        <h4 class="text-white text-center mb-4">
          <i class="bi bi-box-seam"></i> Reporting & Analytics
        </h4>
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link text-white" th:href="@{/}">
              <i class="bi bi-speedometer2"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" th:href="@{/items}">
              <i class="bi bi-list-ul"></i> All Items
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" th:href="@{/add-item}">
              <i class="bi bi-plus-circle"></i> Add New Item
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" th:href="@{/low-stock}">
              <i class="bi bi-exclamation-triangle"></i> Low Stock
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active text-white" th:href="@{/charts}">
              <i class="bi bi-bar-chart"></i> Analytics
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Main content -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2"><i class="bi bi-bar-chart"></i> Stock Analytics</h1>
      </div>

      <div class="row">
        <!-- Quantity by Category Chart -->
        <div class="col-md-6 mb-4">
          <div class="card">
            <div class="card-header">
              <h5 class="card-title mb-0">Stock Quantity by Category</h5>
            </div>
            <div class="card-body">
              <canvas id="quantityChart" width="400" height="300"></canvas>
            </div>
          </div>
        </div>

        <!-- Stock Value by Category Chart -->
        <div class="col-md-6 mb-4">
          <div class="card">
            <div class="card-header">
              <h5 class="card-title mb-0">Total Stock Value by Category</h5>
            </div>
            <div class="card-body">
              <canvas id="valueChart" width="400" height="300"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Data Tables -->
      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-header">
              <h5 class="card-title mb-0">Category Summary</h5>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-striped">
                  <thead>
                  <tr>
                    <th>Category</th>
                    <th>Total Quantity</th>
                    <th>Total Value</th>
                    <th>Number of Items</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="quantity,iter : ${quantityData}">
                    <td th:text="${quantity[0]}"></td>
                    <td th:text="${quantity[1]}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(valueData[iter.index][1], 1, 2)}"></td>
                    <td th:text="${@stockItemRepository.findByCategory(quantity[0]).size()}"></td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Quantity Chart
  const quantityCtx = document.getElementById('quantityChart').getContext('2d');
  const quantityChart = new Chart(quantityCtx, {
    type: 'bar',
    data: {
      labels: [<th:block th:each="data : ${quantityData}">'<th:block th:text="${data[0]}"/>',</th:block>],
      datasets: [{
        label: 'Stock Quantity',
        data: [<th:block th:each="data : ${quantityData}"><th:block th:text="${data[1]}"/>,</th:block>],
        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'],
        borderColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'],
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: true },
        title: { display: true, text: 'Stock Quantity Distribution' }
      }
    }
  });

  // Value Chart
  const valueCtx = document.getElementById('valueChart').getContext('2d');
  const valueChart = new Chart(valueCtx, {
    type: 'pie',
    data: {
      labels: [<th:block th:each="data : ${valueData}">'<th:block th:text="${data[0]}"/>',</th:block>],
      datasets: [{
        label: 'Total Value ($)',
        data: [<th:block th:each="data : ${valueData}"><th:block th:text="${#numbers.formatDecimal(data[1], 1, 2)}"/>,</th:block>],
        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'],
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'right' },
        title: { display: true, text: 'Stock Value Distribution' }
      }
    }
  });
</script>
</body>
</html>

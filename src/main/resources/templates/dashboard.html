<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Stock Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-dark text-white min-vh-100">
            <div class="position-sticky pt-3">
                <h4 class="text-white text-center mb-4">
                    <i class="bi bi-box-seam"></i> Reporting & Analytics
                </h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active text-white" th:href="@{/}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/items}">
                            <i class="bi bi-list-ul"></i> All Items
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/add-item}">
                            <i class="bi bi-plus-circle"></i> Add New Item
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/low-stock}">
                            <i class="bi bi-exclamation-triangle"></i> Low Stock
                            <span th:if="${lowStockItems > 0}" class="badge bg-danger rounded-pill" th:text="${lowStockItems}"></span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/charts}">
                            <i class="bi bi-bar-chart"></i> Analytics
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-speedometer2"></i> Dashboard</h1>
            </div>

            <!-- Stats Cards -->
            <div class="row mb-4">
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-primary">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-8">
                                    <h5>Total Items</h5>
                                    <h2 th:text="${totalItems}">0</h2>
                                </div>
                                <div class="col-4 text-end">
                                    <i class="bi bi-box-seam display-4 opacity-50"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-warning">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-8">
                                    <h5>Low Stock</h5>
                                    <h2 th:text="${lowStockItems}">0</h2>
                                </div>
                                <div class="col-4 text-end">
                                    <i class="bi bi-exclamation-triangle display-4 opacity-50"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-info">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-8">
                                    <h5>Categories</h5>
                                    <h2>3</h2>
                                </div>
                                <div class="col-4 text-end">
                                    <i class="bi bi-tags display-4 opacity-50"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-success">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-8">
                                    <h5>Total Value</h5>
                                    <h2>$12,459</h2>
                                </div>
                                <div class="col-4 text-end">
                                    <i class="bi bi-currency-dollar display-4 opacity-50"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Quick Actions</h5>
                        </div>
                        <div class="card-body">
                            <div class="row text-center">
                                <div class="col-md-3 mb-3">
                                    <a th:href="@{/add-item}" class="btn btn-primary btn-lg w-100">
                                        <i class="bi bi-plus-circle"></i><br>Add Item
                                    </a>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <a th:href="@{/items}" class="btn btn-success btn-lg w-100">
                                        <i class="bi bi-list-ul"></i><br>View All
                                    </a>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <a th:href="@{/low-stock}" class="btn btn-warning btn-lg w-100">
                                        <i class="bi bi-exclamation-triangle"></i><br>Low Stock
                                    </a>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <a th:href="@{/charts}" class="btn btn-info btn-lg w-100">
                                        <i class="bi bi-bar-chart"></i><br>Analytics
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

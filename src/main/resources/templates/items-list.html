<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Items - Stock Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-dark text-white min-vh-100">
            <div class="position-sticky pt-3">
                <h4 class="text-white text-center mb-4">
                    <i class="bi bi-box-seam"></i> Reporting & Analytics
                </h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-white" th:href="@{/items}">
                            <i class="bi bi-list-ul"></i> All Items
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/add-item}">
                            <i class="bi bi-plus-circle"></i> Add New Item
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/low-stock}">
                            <i class="bi bi-exclamation-triangle"></i> Low Stock
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/charts}">
                            <i class="bi bi-bar-chart"></i> Analytics
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-list-ul"></i> All Stock Items</h1>
                <a th:href="@{/add-item}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Add New Item
                </a>
            </div>

            <!-- Items Table -->
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Stock Inventory</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Price</th>
                                <th>Total Value</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${items}" th:classappend="${item.quantity < 10} ? 'table-warning'">
                                <td th:text="${item.id}"></td>
                                <td th:text="${item.name}"></td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${item.category}"></span>
                                </td>
                                <td>
                                    <span th:text="${item.quantity}" th:classappend="${item.quantity < 10} ? 'text-danger fw-bold'"></span>
                                    <span th:if="${item.quantity < 10}" class="badge bg-danger ms-1">Low</span>
                                </td>
                                <td th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 2)}"></td>
                                <td th:text="'$' + ${#numbers.formatDecimal(item.quantity * item.price, 1, 2)}"></td>
                                <td>
                                    <a th:href="@{/edit/{id}(id=${item.id})}" class="btn btn-warning btn-sm">
                                        <i class="bi bi-pencil"></i> Edit
                                    </a>
                                    <a th:href="@{/delete/{id}(id=${item.id})}" class="btn btn-danger btn-sm"
                                       onclick="return confirm('Are you sure you want to delete this item?')">
                                        <i class="bi bi-trash"></i> Delete
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management System - Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stat-card h3 {
            font-size: 2rem;
            margin: 5px 0;
            font-weight: bold;
        }
        .stat-card h5 {
            opacity: 0.9;
            margin: 0;
        }
        .api-success { color: #28a745; font-weight: bold; }
        .api-error { color: #dc3545; font-weight: bold; }
        #report-data {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
            <span class="navbar-brand">
                <i class="fas fa-chart-line"></i> Stock Reports Dashboard
            </span>
    </div>
</nav>

<div class="container mt-4">
    <h2>Stock Management System - Reports</h2>

    <!-- Summary Cards -->
    <div class="row" id="summary-cards">
        <div class="col-12 text-center">
            <div class="alert alert-info">Click "Load Dashboard" to see data</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header"><h5>Controls</h5></div>
                <div class="card-body">
                    <button class="btn btn-primary" onclick="loadDashboard()">
                        <i class="fas fa-sync"></i> Load Dashboard
                    </button>
                    <button class="btn btn-success" onclick="testAPI()">
                        <i class="fas fa-plug"></i> Test API
                    </button>
                    <button class="btn btn-info" onclick="loadStockItems()">
                        <i class="fas fa-boxes"></i> View All Items
                    </button>
                    <button class="btn btn-warning" onclick="loadLowStock()">
                        <i class="fas fa-exclamation-triangle"></i> Low Stock
                    </button>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header"><h5>API Status</h5></div>
                <div class="card-body">
                    <div id="api-status">Ready to test</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Data Display -->
    <div class="card mt-4">
        <div class="card-header"><h5>Raw Data</h5></div>
        <div class="card-body">
            <pre id="report-data">No data loaded yet</pre>
        </div>
    </div>
</div>

<script>
    // JavaScript functions to call your API endpoints
    async function testAPI() {
        const status = document.getElementById('api-status');
        status.innerHTML = '<span class="text-warning">Testing...</span>';

        try {
            const response = await fetch('/test');
            const result = await response.text();
            status.innerHTML = `<span class="api-success">✅ ${result}</span>`;
        } catch (error) {
            status.innerHTML = `<span class="api-error">❌ Failed: ${error}</span>`;
        }
    }

    async function loadDashboard() {
        const dataElement = document.getElementById('report-data');
        dataElement.textContent = 'Loading dashboard data...';

        try {
            const response = await fetch('/api/dashboard');
            const data = await response.json();

            // Update cards with REAL data
            document.getElementById('summary-cards').innerHTML = `
                    <div class="col-md-2">
                        <div class="stat-card">
                            <h5>Total Items</h5>
                            <h3>${data.totalItems}</h3>
                            <small>From database</small>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <div class="stat-card">
                            <h5>Low Stock</h5>
                            <h3>${data.lowStockItems}</h3>
                            <small>Need restocking</small>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <div class="stat-card">
                            <h5>Stock Value</h5>
                            <h3>$${data.totalStockValue.toFixed(2)}</h3>
                            <small>Total worth</small>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <div class="stat-card">
                            <h5>Total Sales</h5>
                            <h3>${data.totalSales}</h3>
                            <small>This month</small>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <div class="stat-card">
                            <h5>Revenue</h5>
                            <h3>$${data.totalRevenue.toFixed(2)}</h3>
                            <small>Total income</small>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <div class="stat-card">
                            <h5>Data Source</h5>
                            <h4>${data.period}</h4>
                            <small>Live MySQL</small>
                        </div>
                    </div>
                `;

            // Show raw data
            dataElement.textContent = JSON.stringify(data, null, 2);

        } catch (error) {
            dataElement.textContent = `Error: ${error}`;
        }
    }

    async function loadStockItems() {
        const dataElement = document.getElementById('report-data');
        dataElement.textContent = 'Loading all stock items...';

        try {
            const response = await fetch('/api/stock-items');
            const items = await response.json();
            dataElement.textContent = 'All Stock Items:\n' + JSON.stringify(items, null, 2);
        } catch (error) {
            dataElement.textContent = `Error loading stock items: ${error}`;
        }
    }

    async function loadLowStock() {
        const dataElement = document.getElementById('report-data');
        dataElement.textContent = 'Loading low stock items...';

        try {
            const response = await fetch('/api/low-stock');
            const items = await response.json();
            dataElement.textContent = 'Low Stock Items (Quantity < 10):\n' + JSON.stringify(items, null, 2);
        } catch (error) {
            dataElement.textContent = `Error loading low stock items: ${error}`;
        }
    }

    // Auto-test on page load
    window.onload = function() {
        testAPI();
        loadDashboard();
    };
</script>
</body>
</html>
